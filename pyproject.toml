[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "howto-agent"
version = "0.1.0"
description = "Framework-independent domain logic for an experimental Open WebUI how-to agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "agent/src"}

[tool.setuptools.packages.find]
where = ["agent/src"]
